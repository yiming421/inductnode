name: gilt
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch=2.3.0
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - pip:
      - --find-links https://data.pyg.org/whl/torch-2.3.0+cu121.html
      - torch-scatter==2.1.2+pt23cu121
      - torch-sparse==0.6.18+pt23cu121
      - torch-geometric==2.7.0
      - torch-hd==5.8.4
      - ogb==1.3.6
      - scikit-learn==1.4.1.post1
      - scipy==1.15.3
      - pandas==2.2.2
      - psutil==7.2.0
      - pytest==8.3.5
